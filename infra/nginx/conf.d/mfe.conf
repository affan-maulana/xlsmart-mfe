# One host, five independently deployed applications.
#
#   /            -> shell   (platform: layout, navigation, user info)
#   /auth        -> auth    (identity: sign-in, sign-out, session contract)
#   /customer360 -> customer360
#   /queue       -> queue
#   /pretopost   -> pretopost
#
# Each application already declares its own basePath, therefore the URI is
# forwarded unchanged (proxy_pass without a URI component). Nothing is composed
# at the edge: no subrequests, no SSR blending, no shared runtime.

upstream mfe_shell       { server shell:3000       keepalive 16; }
upstream mfe_auth        { server auth-app:3004     keepalive 16; }
upstream mfe_customer360 { server customer360:3001 keepalive 16; }
upstream mfe_queue       { server queue:3002       keepalive 16; }
upstream mfe_pretopost   { server pretopost:3003   keepalive 16; }

# `Connection: ` header must be cleared for keepalive unless upgrading.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name app.company.com;

  # TLS terminates upstream in production; the app reads this to decide whether
  # the session cookie is issued with the Secure attribute.
  # If NGINX itself terminates TLS, uncomment:
  # listen 443 ssl http2;
  # ssl_certificate     /etc/nginx/tls/app.company.com.crt;
  # ssl_certificate_key /etc/nginx/tls/app.company.com.key;

  access_log /var/log/nginx/mfe.access.log combined;
  error_log  /var/log/nginx/mfe.error.log warn;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Longest prefix wins, so domain routes are matched before the shell catch-all.
  location = /healthz {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","edge":"nginx"}';
  }

  # Stable URLs for people who bookmark or link sign-in without the /auth prefix.
  location = /login  { return 302 /auth/login$is_args$args; }
  location = /logout { return 302 /auth/logout$is_args$args; }

  location /auth {
    proxy_pass http://mfe_auth;
    include /etc/nginx/snippets/proxy.inc;
  }

  location /customer360 {
    proxy_pass http://mfe_customer360;
    include /etc/nginx/snippets/proxy.inc;
  }

  location /queue {
    proxy_pass http://mfe_queue;
    include /etc/nginx/snippets/proxy.inc;
  }

  location /pretopost {
    proxy_pass http://mfe_pretopost;
    include /etc/nginx/snippets/proxy.inc;
  }

  location / {
    proxy_pass http://mfe_shell;
    include /etc/nginx/snippets/proxy.inc;
  }
}
