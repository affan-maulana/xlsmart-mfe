# Local development: NGINX routes ucs.xlsmart.local by path to localhost dev servers.
# Usage:
#   1. Add "127.0.0.1  ucs.xlsmart.local" to /etc/hosts
#   2. nginx -c infra/nginx/dev.conf
#   3. pnpm dev
#   4. Open http://ucs.xlsmart.local

worker_processes 1;

events { worker_connections 1024; }

http {
  include /Users/affan/Documents/XLsmart/Meteor/Frontend/mfe/infra/nginx/snippets/proxy.inc;

  upstream mfe_shell              { server 127.0.0.1:3000; }
  upstream mfe_auth               { server 127.0.0.1:3004; }
  upstream mfe_customer360        { server 127.0.0.1:3001; }
  upstream mfe_queue              { server 127.0.0.1:3002; }
  upstream mfe_subscription_mgmt  { server 127.0.0.1:3003; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name ucs.xlsmart.local;

    # Stable sign-in/sign-out URLs
    location = /login  { return 302 /auth/login$is_args$args; }
    location = /logout { return 302 /auth/logout$is_args$args; }

    location /subscription-management {
      proxy_pass http://mfe_subscription_mgmt;
    }
    location /customer360 {
      proxy_pass http://mfe_customer360;
    }
    location /queue {
      proxy_pass http://mfe_queue;
    }
    location /auth {
      proxy_pass http://mfe_auth;
    }
    location / {
      proxy_pass http://mfe_shell;
    }
  }
}
