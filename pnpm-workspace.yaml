packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 blocks dependency postinstall scripts unless explicitly approved.
allowBuilds:
  sharp: false
  unrs-resolver: false

catalog:
  # runtime
  next: ^16.3.6
  react: ^19.3.0
  react-dom: ^19.3.0
  # styling + ui primitives
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  lucide-react: ^1.48.0
  "@radix-ui/react-slot": ^1.3.3
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-tooltip": ^1.2.16
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-separator": ^1.1.15
  "@radix-ui/react-label": ^2.1.15
  # forms + validation
  react-hook-form: ^7.89.0
  server-only: ^0.0.1
  zod: ^4.6.5
  "@hookform/resolvers": ^5.9.1
  # toolchain
  typescript: ^5.9.3
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  turbo: ^2.11.5
  eslint: ^9
  eslint-config-next: ^16.3.6
  prettier: ^3.9.9
  # testing
  vitest: ^5.0.2
  "@vitejs/plugin-react": ^6.1.1
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/user-event": ^14.6.7
  jsdom: ^30.1.1

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
